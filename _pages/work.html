---
layout: archive
title: "Work"
permalink: /work/
author_profile: true
---

{% assign featured_work = site.work | where: "featured", true %}

<div class="work-grid">
{% for post in featured_work %}
  <div class="work-card">

    {% if post.image %}
    <a href="{{ post.url }}">
        <img class="work-thumb" src="{{ post.image }}">
    </a>
    {% endif %}

    <h3>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h3>

    <p>{{ post.excerpt }}</p>

  </div>
{% endfor %}
</div>
