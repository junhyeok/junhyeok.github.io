{% assign featured_work = site.work | where: "featured", true %}

<div class="work-grid">
{% for post in featured_work %}
  <div class="work-card">
    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt }}</p>
  </div>
{% endfor %}
</div>
